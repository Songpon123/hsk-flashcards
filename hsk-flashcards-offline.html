<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="บัตรคำศัพท์ภาษาจีน HSK 1–3 ไทย–จีน และ English–Chinese พร้อมพินอิน ประโยคตัวอย่าง และที่มาของตัวอักษร">
<title>บัตรคำศัพท์ HSK 1–3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Sans:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: one study column. Level picker, options, progress, a single card with 田字格 practice boxes, then actions. */
:root{
  --paper:#F2F5F1; --card:#FFFFFF; --ink:#17231F; --ink-2:#56675F; --line:#D6DFD9;
  --jade:#1F6F5C; --jade-ink:#FFFFFF; --jade-soft:#E2EFE9;
  --seal:#B5392A; --seal-soft:#F8E6E2;
  --grid:#E5B3AA; --grid-edge:#D08E83;
  --mark:#FBEFC4; --mark-ink:#4F3B00;
  --shadow:0 1px 2px rgba(23,35,31,.06),0 14px 34px -14px rgba(23,35,31,.22);
  --f-hanzi:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-thai:"IBM Plex Sans Thai","Thonburi","Leelawadee UI","Tahoma",sans-serif;
  --f-py:"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1412; --card:#18201D; --ink:#E6EDE9; --ink-2:#9BAEA6; --line:#2B3732;
    --jade:#62C3A7; --jade-ink:#0B1A15; --jade-soft:#1B3029;
    --seal:#E8796A; --seal-soft:#371F1B;
    --grid:#5B3B35; --grid-edge:#7D4C43;
    --mark:#4A3C10; --mark-ink:#F6E3A4;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 14px 34px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1412; --card:#18201D; --ink:#E6EDE9; --ink-2:#9BAEA6; --line:#2B3732;
  --jade:#62C3A7; --jade-ink:#0B1A15; --jade-soft:#1B3029;
  --seal:#E8796A; --seal-soft:#371F1B;
  --grid:#5B3B35; --grid-edge:#7D4C43;
  --mark:#4A3C10; --mark-ink:#F6E3A4;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 14px 34px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-thai);font-size:16px;line-height:1.55}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

.wrap{max-width:46rem;margin:0 auto;padding-block:1.5rem 3rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:1.1rem}

header{display:flex;flex-direction:column;gap:.15rem}
.eyebrow{font-family:var(--f-hanzi);color:var(--seal);font-size:.9rem;letter-spacing:.12em}
h1{margin:0;font-size:clamp(1.5rem,4.5vw,2rem);line-height:1.2;font-weight:600;text-wrap:balance}
.lede{margin:0;color:var(--ink-2);font-size:.95rem}

.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:.3rem}
.seg{border:0;background:transparent;border-radius:10px;padding:.5rem .2rem;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:.05rem;color:var(--ink-2);min-width:0}
.seg:hover{background:var(--jade-soft)}
.seg[aria-pressed="true"]{background:var(--jade);color:var(--jade-ink)}
.seg-name{font-weight:600;font-size:.95rem;color:inherit}
.seg[aria-pressed="false"] .seg-name{color:var(--ink)}
.seg-meta{font-size:.72rem;font-variant-numeric:tabular-nums;white-space:nowrap}

.opts{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.38rem .85rem;
  cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:.4rem}
.chip:hover{border-color:var(--jade)}
.chip[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);font-weight:500}
.chip .tick{width:.9rem;height:.9rem;border:1.5px solid currentColor;border-radius:4px;display:inline-grid;place-items:center;opacity:.7}
.chip[aria-pressed="true"] .tick{background:var(--jade);border-color:var(--jade);opacity:1}
.chip[aria-pressed="true"] .tick::after{content:"";width:.42rem;height:.22rem;border-left:2px solid var(--jade-ink);border-bottom:2px solid var(--jade-ink);transform:translateY(-1px) rotate(-45deg)}
.pair{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:2px}
.pair .chip{border:0;padding:.33rem .8rem}
.pair .chip[aria-pressed="true"]{background:var(--jade);color:var(--jade-ink)}

.search{position:relative}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:.6rem 2.6rem .6rem 2.4rem;font-size:.95rem}
.search input::placeholder{color:var(--ink-2)}
.search svg{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);width:1.05rem;height:1.05rem;color:var(--ink-2);pointer-events:none}
.search .clear{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;
  color:var(--ink-2);padding:.35rem .55rem;border-radius:8px;font-size:.85rem}
.search .clear:hover{background:var(--jade-soft)}

.progress{display:flex;flex-direction:column;gap:.4rem}
.progress-row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-size:.9rem;color:var(--ink-2)}
#count{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.keys{font-size:.78rem}
.keys kbd,.btn kbd{font-family:var(--f-py);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .35rem;background:var(--card);color:var(--ink-2)}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
#bar{height:100%;background:var(--jade);width:0;transition:width .25s ease}

/* One card, revealed in place: the word stays where it is and the answer appears under it. */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;cursor:pointer;touch-action:pan-y;min-height:24rem}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;min-height:1.6rem;
  padding:1.1rem clamp(1rem,4vw,1.5rem) 0}
.card-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.85rem;text-align:center;
  padding:.75rem clamp(1rem,4vw,1.75rem) 1.5rem;min-width:0}
.card-hint{font-size:.78rem;letter-spacing:.06em;color:var(--ink-2)}
.card-bottom{display:flex;justify-content:space-between;align-items:center;gap:.75rem;cursor:default;
  padding:.7rem clamp(1rem,4vw,1.5rem);border-top:1px solid var(--line);background:var(--paper);font-size:.8rem;color:var(--ink-2)}
.answer{display:flex;flex-direction:column;align-items:center;gap:.8rem;width:100%}
.answer-rule{width:3.5rem;height:1px;background:var(--line)}
@media (prefers-reduced-motion:no-preference){.answer,.appear{animation:appear .2s ease-out}}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stamp{font-family:var(--f-py);font-weight:500;font-size:.74rem;letter-spacing:.08em;color:var(--seal);
  border:1.5px solid var(--seal);border-radius:4px;padding:.12rem .45rem;transform:rotate(-3deg)}
.known-tag{font-size:.75rem;color:var(--jade);background:var(--jade-soft);padding:.12rem .6rem;border-radius:999px}

.tzg{display:flex;justify-content:center;align-items:center;gap:.5rem;width:100%}
.tzg .box{position:relative;flex:0 1 auto;min-width:0;aspect-ratio:1;container-type:inline-size;
  width:min(var(--bx),calc((100% - (var(--n) - 1) * .5rem) / var(--n)));
  border:1.5px solid var(--grid-edge);display:grid;place-items:center;box-sizing:border-box}
.tzg .box::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--grid)}
.tzg .box::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px dashed var(--grid)}
.tzg .ch{position:relative;z-index:1;font-family:var(--f-hanzi);font-weight:500;line-height:1;font-size:3.5rem;font-size:72cqi}
.tzg .dots{font-family:var(--f-hanzi);color:var(--ink-2);font-size:1.6rem;flex:none}
.py-big{margin:0;font-family:var(--f-py);font-size:1.55rem;color:var(--jade);letter-spacing:.02em;text-align:center}
.th-big{margin:0;font-size:clamp(1.6rem,5.5vw,2.3rem);font-weight:600;text-align:center;text-wrap:balance;line-height:1.35}

.th-mean{margin:0;font-size:1.45rem;font-weight:600;line-height:1.4;text-wrap:balance}
.ex{width:100%;box-sizing:border-box;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.85rem 1rem;display:flex;flex-direction:column;gap:.3rem}
.ex-label{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--ink-2);letter-spacing:.04em}
.ex-zh{margin:0;font-family:var(--f-hanzi);font-size:1.4rem;line-height:1.65;font-weight:500}
.ex-zh mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 .08em}
.ex-py{margin:0;font-family:var(--f-py);font-size:.95rem;color:var(--ink-2)}
.ex-tr{margin:0;font-size:1.02rem}
.other-mean{margin:-.45rem 0 0;font-size:.95rem;color:var(--ink-2);text-wrap:balance}

.origin{width:100%;box-sizing:border-box;text-align:left;border:1px solid var(--line);border-radius:14px;
  padding:0 1rem .9rem;background:var(--card);cursor:default}
.origin:not([open]){padding-bottom:0}
.origin summary{cursor:pointer;font-weight:600;color:var(--jade);padding:.7rem 0}
.lit{margin:.1rem 0 .8rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .6rem;line-height:1.55}
.lit-label{font-size:.72rem;letter-spacing:.04em;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:.05rem .55rem;white-space:nowrap}
.story{background:var(--seal-soft);border-radius:10px;padding:.7rem .85rem;margin:0 0 .9rem;display:flex;flex-direction:column;gap:.3rem}
.story-label{font-size:.72rem;letter-spacing:.04em;color:var(--seal);font-weight:600}
.story p{margin:0;line-height:1.65;color:var(--ink)}
.by-char{margin:0 0 .5rem;font-size:.78rem;letter-spacing:.04em;color:var(--ink-2)}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13rem),1fr));gap:.6rem}
.ch-tile{border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;background:var(--paper);
  display:flex;flex-direction:column;gap:.25rem;min-width:0}
.ch-head{display:flex;align-items:baseline;gap:.6rem}
.ch-big{font-family:var(--f-hanzi);font-size:2rem;font-weight:700;line-height:1.1}
.ch-py{font-family:var(--f-py);font-size:.95rem;color:var(--jade)}
.ch-mean{margin:0;font-weight:600}
.ch-kind{margin:0;font-size:.72rem;letter-spacing:.04em;color:var(--seal)}
.ch-struct{margin:0;font-size:.88rem;line-height:1.6;color:var(--ink-2)}
.ch-struct b,.hz{font-family:var(--f-hanzi);font-weight:600;color:var(--ink)}
.ch-struct small{font-size:.75rem}
.origin-credit{margin:.75rem 0 0;font-size:.72rem;color:var(--ink-2)}
footer a{color:var(--jade)}

.speak{display:none;align-items:center;gap:.35rem;border:1px solid var(--line);background:var(--card);color:var(--jade);
  border-radius:999px;padding:.28rem .7rem;cursor:pointer;font-size:.8rem}
.speak svg{width:1rem;height:1rem}
.speak:hover{border-color:var(--jade);background:var(--jade-soft)}
.can-speak .speak{display:inline-flex}
.ex-label .speak{padding:.15rem .5rem}
.speak:disabled{opacity:.4;cursor:default}
.speak:disabled:hover{border-color:var(--line);background:var(--card)}

.actions{display:flex;flex-direction:column;gap:.55rem}
.row{display:grid;gap:.55rem}
.row.nav{grid-template-columns:1fr 1.4fr 1fr}
.row.marks{grid-template-columns:1fr 1fr}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:.72rem .8rem;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font-weight:500;min-width:0}
.btn:hover{border-color:var(--jade)}
.btn-flip{border-color:var(--jade);color:var(--jade)}
.btn-miss{background:var(--seal-soft);border-color:transparent;color:var(--seal)}
.btn-miss:hover{border-color:var(--seal)}
.btn-know{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.btn-know:hover{filter:brightness(1.08)}
.btn-miss kbd,.btn-know kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.7}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:2.5rem 1.25rem;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:.8rem}
.empty p{margin:0;color:var(--ink-2)}
.empty .big{font-size:1.15rem;color:var(--ink);font-weight:600}

footer{display:flex;flex-direction:column;gap:.6rem;font-size:.82rem;color:var(--ink-2);border-top:1px solid var(--line);padding-top:1rem}
footer p{margin:0;max-width:65ch}
.linkbtn{align-self:flex-start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:.3rem .8rem;cursor:pointer;color:var(--ink-2);font-size:.8rem}
.linkbtn.armed{border-color:var(--seal);color:var(--seal)}

.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:.55rem 1rem;border-radius:999px;font-size:.88rem;z-index:20;
  max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

@media (hover:none),(max-width:560px){.keys,.btn kbd{display:none}}
@media (max-width:420px){
  .card{min-height:21rem}
  .seg-name{font-size:.88rem}
  .row.nav{grid-template-columns:1fr 1.2fr 1fr}
}
@media (prefers-reduced-motion:reduce){#bar{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow" lang="zh-CN">汉语水平考试 · 一级至三级</span>
    <h1 data-i18n="title">บัตรคำศัพท์ HSK 1–3</h1>
    <p class="lede" id="lede">คำศัพท์ภาษาจีนพร้อมพินอิน คำแปลไทย และประโยคตัวอย่าง</p>
  </header>

  <div class="levels" id="levels" role="group" aria-label="เลือกระดับ"></div>

  <div class="opts">
    <span class="pair" role="group" aria-label="ภาษา / Language">
      <button type="button" class="chip" data-lang="th" lang="th">ไทย</button>
      <button type="button" class="chip" data-lang="en" lang="en">English</button>
    </span>
    <span class="pair" role="group" id="dirGroup" aria-label="ด้านหน้าบัตร">
      <button type="button" class="chip" id="dirZh" data-dir="zh">จีน → ไทย</button>
      <button type="button" class="chip" id="dirMean" data-dir="mean">ไทย → จีน</button>
    </span>
    <button type="button" class="chip" id="optPinyin"><span class="tick"></span><span data-i18n="pinyinFront">พินอินด้านหน้า</span></button>
    <button type="button" class="chip" id="optNew"><span class="tick"></span><span data-i18n="onlyNew">เฉพาะคำที่ยังไม่แม่น</span></button>
    <button type="button" class="chip" id="optShuffle"><span class="tick"></span><span data-i18n="shuffle">สุ่มลำดับ</span></button>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ค้นหาด้วยตัวจีน พินอิน หรือคำไทย" autocomplete="off" aria-label="ค้นหาคำศัพท์">
    <button type="button" class="clear" id="qClear" data-i18n="clear" hidden>ล้าง</button>
  </div>

  <div class="progress">
    <div class="progress-row">
      <span id="count">กำลังโหลดคำศัพท์…</span>
      <span class="keys" data-i18n-html="keys"><kbd>Space</kbd> ดูเฉลย · <kbd>←</kbd> <kbd>→</kbd> เปลี่ยนบัตร</span>
    </div>
    <div class="track"><div id="bar"></div></div>
  </div>

  <article class="card" id="card" aria-label="บัตรคำ" hidden>
    <div class="card-top" id="cardTop"></div>
    <div class="card-body" id="cardBody" aria-live="polite"></div>
    <div class="card-bottom">
      <span id="cardSeq"></span>
      <button type="button" class="speak" id="speak" aria-label="ฟังเสียงภาษาจีน"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span data-i18n="listen">ฟังเสียงภาษาจีน</span></button>
    </div>
  </article>

  <div class="empty" id="empty" hidden>
    <p class="big" id="emptyBig"></p>
    <p id="emptyMsg"></p>
    <button type="button" class="btn" id="emptyAction" hidden></button>
  </div>

  <div class="actions" id="actions" hidden>
    <div class="row nav">
      <button type="button" class="btn" id="prev" data-i18n="prev">← ก่อนหน้า</button>
      <button type="button" class="btn btn-flip" id="flipBtn">ดูเฉลย</button>
      <button type="button" class="btn" id="next" data-i18n="next">ถัดไป →</button>
    </div>
    <div class="row marks">
      <button type="button" class="btn btn-miss" id="miss"><kbd>1</kbd> ยังไม่แม่น</button>
      <button type="button" class="btn btn-know" id="know"><kbd>2</kbd> จำได้แล้ว</button>
    </div>
  </div>

  <footer>
    <p data-i18n="foot1"></p>
    <p data-i18n="foot2"></p>
    <p data-i18n-html="foot3"></p>
    <button type="button" class="linkbtn" id="reset" data-i18n="reset">ล้างสถานะจำได้ของระดับที่เลือก</button>
  </footer>

      ({ id: `${lv}|${h}|${p}`, lv, h, p, t, s, sp, st, en, sen, litTh, litEn, storyTh, storyEn }));

    buildDeck("reset");
  }).catch(() => {
    $("#count").textContent = L.loadFail;
  });
})();
</script>
